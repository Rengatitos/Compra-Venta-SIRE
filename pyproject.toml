[project]
name = "facturas-api"
version = "0.1.0"
description = "Electronic Invoicing Management API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.8.1",
    "requests>=2.31.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.2.2",
    "google-genai>=0.6.0",
    "numpy>=1.26.0",
    "motor>=3.7.1",
    "pymongo>=4.11.3",
    "PyJWT>=2.10.1",
    "slowapi>=0.1.9",
    "cryptography>=44.0.2",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.20",
    "shared-auth-lib",
]


[tool.uv.sources]
shared-auth-lib = { path = "shared-auth-lib" }

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]
