[project]
name = "facturas-api"
version = "0.1.0"
description = "Electronic Invoicing Management API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.8.1",
    "requests>=2.31.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.2.2",
    "google-genai>=0.6.0",
    "numpy>=1.26.0",
    "motor>=3.7.1",
    "pymongo>=4.11.3",
    "PyJWT>=2.10.1",
    "slowapi>=0.1.9",
    "cryptography>=44.0.2",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI declara dependencias como valores por defecto.
    "UP042", # `str, Enum` en vez de `StrEnum`: pydantic y FastAPI serializan
             # el primero de forma predecible en respuestas y parámetros.
]

[tool.ruff.lint.per-file-ignores]
# Texto de prompts y selectores del portal SOL: cortarlos los vuelve ilegibles.
"app/services/analisis_ia.py" = ["E501"]
"app/services/scraping_sunat.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# El proyecto no se instala como paquete; se importa desde la raíz.
pythonpath = ["."]
