[project]
name = "facturas-api"
version = "0.1.0"
description = "Electronic Invoicing Management API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.8.1",
    "requests>=2.31.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.2.2",
    "motor>=3.7.1",
    "pymongo>=4.11.3",
    "PyJWT>=2.10.1",
    "slowapi>=0.1.9",
    "cryptography>=44.0.2",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "python-multipart>=0.0.20",
    # Clasificador contable (app/services/clasificador): RAG local + Gemini.
    "numpy>=1.26,<3.0",
    "faiss-cpu>=1.8,<2.0",
    "torch>=2.2,<3.0",
    "transformers>=4.48,<5.0",
    "accelerate>=1.0,<2.0",
    "pypdf>=5.0,<7.0",
    "PyYAML>=6.0,<7.0",
    "google-genai>=1.0,<2.0",
]

# torch sólo corre en CPU (embeddings). El paquete de PyPI trae CUDA en Linux y
# multiplica el tamaño de la imagen; el índice CPU de PyTorch no.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.15.10",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI declara dependencias como valores por defecto.
    "UP042", # `str, Enum` en vez de `StrEnum`: pydantic y FastAPI serializan
             # el primero de forma predecible en respuestas y parámetros.
]

[tool.ruff.lint.per-file-ignores]
# Texto de prompts y selectores del portal SOL: cortarlos los vuelve ilegibles.
"app/services/scraping_sunat.py" = ["E501"]
# Motor del clasificador, portado de su API original: se deja con su formato
# para poder compararlo con aquella.
"app/services/clasificador/*" = ["E501"]
"tests/services/test_clasificador_*.py" = ["E501"]
# HTML real de la Consulta RUC de SUNAT usado como fixture.
"tests/services/test_ficha_ruc.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# El proyecto no se instala como paquete; se importa desde la raíz.
pythonpath = ["."]
