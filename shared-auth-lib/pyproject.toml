[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-auth-lib"
version = "1.0.0"
description = "Shared JWT authentication utilities for microservices"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_auth_lib*"]
