# Construye las imágenes de la API y del panel en GitHub y las publica en GHCR.
#
# La VM de producción (4 GB) no puede construir la imagen de la API (torch +
# Chromium): se cae. Aquí se construye y la VM solo descarga la imagen.
#
# Secretos opcionales (Settings → Secrets and variables → Actions):
#   EASYPANEL_DEPLOY_API, EASYPANEL_DEPLOY_WEB: la "Deployment URL" de cada
#   servicio en Easypanel. Si están, al terminar se redespliega solo.
# Variable opcional: VITE_GOOGLE_CLIENT_ID (si no, usa el del cliente web actual).

name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: api
            contexto: .
            deploy: EASYPANEL_DEPLOY_API
          - servicio: web
            contexto: ./frontend
            deploy: EASYPANEL_DEPLOY_WEB
    steps:
      # La imagen de la API pesa ~6 GB: el runner necesita espacio libre.
      - name: Liberar disco
        if: matrix.servicio == 'api'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sire-${{ matrix.servicio }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:latest
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID || '257729885873-r2f868plc3gsr2jhe2db32hp9igg93ua.apps.googleusercontent.com' }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

      - name: Redesplegar en Easypanel
        env:
          URL: ${{ secrets[matrix.deploy] }}
        run: |
          if [ -z "$URL" ]; then
            echo "Sin ${{ matrix.deploy }}: no se redespliega."
          else
            curl -fsS -m 60 -X POST "$URL"
          fi
